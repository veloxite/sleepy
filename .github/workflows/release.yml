name: Build desktop apps
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: ubuntu-24.04
            label: linux-x64
          - os: macos-14
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libnss3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libasound2t64 libpulse0 libdbus-1-3 libfontconfig1 libxcomposite1 libxdamage1 libxrandr2 libxtst6
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pip check
      - run: python -m unittest discover -v -p "test_*.py"
      - run: python build_app.py
      - name: Smoke test packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ./dist/Sleepy/Sleepy.exe -ArgumentList '--self-test', "$pwd/build/smoke.json" -WindowStyle Hidden -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'Packaged app timed out' }
          if ($p.ExitCode -ne 0) { throw 'Packaged app failed' }
      - name: Smoke test packaged Linux app
        if: runner.os == 'Linux'
        run: xvfb-run -a ./dist/Sleepy/Sleepy --self-test "$PWD/build/smoke.json"
      - name: Smoke test packaged macOS app
        if: runner.os == 'macOS'
        run: ./dist/Sleepy.app/Contents/MacOS/Sleepy --self-test "$PWD/build/smoke.json"
      - name: Require successful renderer check
        if: always()
        run: python -c "import json; r=json.load(open('build/smoke.json')); print(r); assert r['ok']"
      - run: python build_app.py --package
      - uses: actions/upload-artifact@v4
        with:
          name: Sleepy-${{ matrix.label }}
          path: dist/installers/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-${{ matrix.label }}
          path: |
            build/smoke.json
            build/Sleepy/warn-Sleepy.txt
            build/licenses/dependency-versions.json

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Sleepy-*
          path: artifacts
      - name: Publish a draft for human device testing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
          find artifacts -name SHA256SUMS.txt -exec cat {} + > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --draft --prerelease --title "Sleepy $GITHUB_REF_NAME (preview)" --notes-file packaging/RELEASE_NOTES.md
          find artifacts -type f ! -name SHA256SUMS.txt -exec gh release upload "$GITHUB_REF_NAME" {} +
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt
